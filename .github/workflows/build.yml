name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # --add-data      copia los RECURSOS (imagenes, iconos) dentro del .exe.
      # --hidden-import declara los modulos que se importan dentro de funciones
      #                 (import diferido), que PyInstaller no siempre detecta.
      # Los demas modulos .py se empaquetan solos siguiendo el grafo de imports.
      - name: Build EXE
        run: >
          pyinstaller --onefile --windowed
          --name ThermoPhase
          --icon thermophase.ico
          --add-data "splash.png;."
          --add-data "thermophase.ico;."
          --hidden-import envolvente_michelsen
          --hidden-import simulacion
          --hidden-import reporte_pdf
          --hidden-import asociar_extension
          main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThermoPhase-Windows
          path: dist/ThermoPhase.exe

      - name: Publish release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ThermoPhase.exe
